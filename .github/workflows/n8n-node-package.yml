name: n8n Atto Node

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      package_version: ${{ steps.metadata.outputs.package_version }}
      release_version: ${{ steps.metadata.outputs.release_version }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      needs_version_commit: ${{ steps.metadata.outputs.needs_version_commit }}
      release_ready: ${{ steps.metadata.outputs.release_ready }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - id: semantic
        name: Semantic Release Dry Run
        uses: cycjimmy/semantic-release-action@v6
        with:
          semantic_version: 24.2.7
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute package version
        id: metadata
        env:
          GITHUB_REF_NAME_FULL: ${{ github.ref }}
          LAST_RELEASE_VERSION: ${{ steps.semantic.outputs.last_release_version }}
          NEW_RELEASE_VERSION: ${{ steps.semantic.outputs.new_release_version }}
          SHA: ${{ github.sha }}
        run: |
          package_name="$(node -p 'require("./package.json").name')"
          current_version="$(node -p 'require("./package.json").version')"
          published_version="$(npm view "$package_name@latest" version)"

          if [ -n "$published_version" ] && [ -z "$LAST_RELEASE_VERSION" ]; then
            echo "::error::npm latest is $published_version, but tag n8n-node-v$published_version is missing from Git history."
            echo "::error::Push the baseline tag before retrying; refusing semantic-release's initial 1.0.0."
            exit 1
          fi

          base_version="${NEW_RELEASE_VERSION:-${LAST_RELEASE_VERSION:-0.0.0}}"
          short_sha="${SHA:0:12}"
          needs_version_commit=false
          release_ready=false
          release_version="$base_version"
          release_tag=""

          if [ -n "$NEW_RELEASE_VERSION" ]; then
            package_version="$NEW_RELEASE_VERSION"
          else
            package_version="${base_version}-snapshot.sha${short_sha}"
          fi

          if [ "$GITHUB_REF_NAME_FULL" = "refs/heads/main" ] && [ -n "$NEW_RELEASE_VERSION" ]; then
            release_version="$NEW_RELEASE_VERSION"
            release_tag="n8n-node-v$NEW_RELEASE_VERSION"

            if [ "$current_version" = "$NEW_RELEASE_VERSION" ]; then
              release_ready=true
            else
              needs_version_commit=true
            fi
          fi

          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "needs_version_commit=$needs_version_commit" >> "$GITHUB_OUTPUT"
          echo "release_ready=$release_ready" >> "$GITHUB_OUTPUT"

  test-and-pack:
    name: Test and pack
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply computed package version
        run: npm version "${{ needs.version.outputs.package_version }}" --no-git-tag-version --allow-same-version

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Pack package
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: attocash-n8n-nodes-atto-package
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 14

  version-pr:
    name: Version PR
    needs:
      - version
      - test-and-pack
    if: needs.version.outputs.needs_version_commit == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: n8n-node-release-preparation-${{ needs.version.outputs.release_version }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Apply release version
        env:
          RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.release_version }}
        run: |
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
          npm run validate:release-tag -- "$RELEASE_TAG"

      - name: Commit and push version
        env:
          RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
        run: |
          release_branch="release/$RELEASE_TAG"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$release_branch"
          git add package.json package-lock.json
          git diff --cached --check
          git commit -m "chore(release): $RELEASE_TAG"

          if git ls-remote --exit-code --heads origin "$release_branch" >/dev/null 2>&1; then
            echo "::notice::Release branch $release_branch already exists; leaving it unchanged."
          else
            git push origin "HEAD:refs/heads/$release_branch"
          fi

      - name: Open version PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
        run: |
          release_branch="release/$RELEASE_TAG"
          existing_pr="$(gh pr list --head "$release_branch" --base main --state open --json url --jq '.[0].url')"

          if [ -n "$existing_pr" ]; then
            echo "Version PR already exists: $existing_pr"
          else
            gh pr create \
              --base main \
              --head "$release_branch" \
              --title "chore(release): $RELEASE_TAG" \
              --body "Commits the CI-calculated package version before tagging and publishing $RELEASE_TAG."
          fi

  release:
    name: Release
    needs:
      - version
      - test-and-pack
    if: needs.version.outputs.release_ready == 'true'
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: n8n-node-release-${{ needs.version.outputs.release_version }}
      cancel-in-progress: true
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"

      - name: Install Trusted Publishing npm version
        run: npm install --global "npm@^11.5.1"

      - name: Verify release toolchain
        run: |
          node_version="$(node --version | sed 's/^v//')"
          npm_version="$(npm --version)"

          node -e 'const [major, minor] = process.argv[1].split(".").map(Number); if (major < 22 || (major === 22 && minor < 14)) process.exit(1)' "$node_version"
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1)' "$npm_version"

          echo "Node.js $node_version"
          echo "npm $npm_version"

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: attocash-n8n-nodes-atto-package
          path: artifacts

      - id: semantic
        name: Create GitHub release
        uses: cycjimmy/semantic-release-action@v6
        with:
          semantic_version: 24.2.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify committed release version
        env:
          ACTUAL_RELEASE_VERSION: ${{ steps.semantic.outputs.new_release_version }}
          RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.release_version }}
        run: |
          node -e '
            const { readFileSync } = require("node:fs");
            const expected = process.env.RELEASE_VERSION;
            const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
            const packageLock = JSON.parse(readFileSync("package-lock.json", "utf8"));

            if (process.env.ACTUAL_RELEASE_VERSION !== expected) {
              throw new Error(
                `semantic-release version ${process.env.ACTUAL_RELEASE_VERSION} does not match ${expected}`,
              );
            }

            for (const [source, actual] of [
              ["package.json", packageJson.version],
              ["package-lock.json", packageLock.version],
              ["package-lock.json root package", packageLock.packages?.[""]?.version],
            ]) {
              if (actual !== expected) {
                throw new Error(`${source} version ${actual} does not match ${expected}`);
              }
            }
          '
          npm run validate:release-tag -- "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

          package_files=(artifacts/*.tgz)
          test "${#package_files[@]}" -eq 1
          for manifest in package/package.json package/dist/package.json; do
            artifact_version="$(
              tar -xOf "${package_files[0]}" "$manifest" |
                node -e '
                  let input = "";
                  process.stdin.setEncoding("utf8");
                  process.stdin.on("data", (chunk) => (input += chunk));
                  process.stdin.on("end", () => process.stdout.write(JSON.parse(input).version));
                '
            )"
            test "$artifact_version" = "$RELEASE_VERSION"
          done

      - name: Publish to npm
        run: npm publish ./artifacts/*.tgz --provenance --access public
