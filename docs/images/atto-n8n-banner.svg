<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title description">
  <title id="title">Atto nodes for n8n</title>
  <desc id="description">Atto payments and live network events connected in an n8n workflow</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111318"/>
      <stop offset="1" stop-color="#20242c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FAB005" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FAB005" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity=".34"/>
    </filter>
  </defs>

  <rect width="1440" height="480" rx="28" fill="url(#background)"/>
  <rect width="1440" height="480" rx="28" fill="url(#grid)"/>
  <circle cx="1170" cy="220" r="330" fill="url(#glow)"/>

  <g transform="translate(104 110)">
    <image href="../../nodes/Atto/atto.svg" x="-6" y="-12" width="138" height="138"/>
    <text x="158" y="61" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="64" font-weight="700" letter-spacing="-2">Atto for n8n</text>
    <text x="158" y="112" fill="#c8ccd4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25">Payments, accounts, and live network events</text>
  </g>

  <g transform="translate(832 153)" filter="url(#shadow)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <path d="M196 62H275" stroke="#FAB005" stroke-width="5" stroke-linecap="round"/>
    <circle cx="196" cy="62" r="7" fill="#FAB005"/>
    <circle cx="275" cy="62" r="7" fill="#FAB005"/>

    <rect width="196" height="124" rx="18" fill="#2c313b" stroke="#4a515e"/>
    <rect x="20" y="22" width="42" height="42" rx="12" fill="#FAB005"/>
    <path d="M31 43h20M41 33v20" stroke="#17191e" stroke-width="4" stroke-linecap="round"/>
    <text x="78" y="48" fill="#ffffff" font-size="19" font-weight="650">Atto Trigger</text>
    <text x="20" y="91" fill="#aeb4bf" font-size="15">Receivable event</text>

    <g transform="translate(275)">
      <rect width="196" height="124" rx="18" fill="#2c313b" stroke="#4a515e"/>
      <rect x="20" y="22" width="42" height="42" rx="12" fill="#FAB005"/>
      <path d="M30 43h22M45 34l9 9-9 9" fill="none" stroke="#17191e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="78" y="48" fill="#ffffff" font-size="19" font-weight="650">Atto</text>
      <text x="20" y="91" fill="#aeb4bf" font-size="15">Receive payment</text>
    </g>
  </g>

  <text x="104" y="414" fill="#8f96a3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">github.com/attocash/integrations-n8n</text>
</svg>
